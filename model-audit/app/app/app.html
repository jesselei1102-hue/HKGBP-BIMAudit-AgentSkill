<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ultraviolet example</title>
  <link rel="stylesheet" href="./theme/tokens.css" />
  <link rel="stylesheet" href="./theme/components.css" />
</head>
<body>
  <div class="app">
    <div class="orbit-clip" aria-hidden="true">
      <svg class="orbit" width="280" height="280" viewBox="0 0 280 280">
        <circle class="o1" cx="140" cy="140" r="118" fill="none" stroke-width="0.6" />
        <circle class="o2" cx="140" cy="140" r="78" fill="none" stroke-width="0.6" />
        <circle class="o4" cx="29" cy="100" r="14" />
        <circle class="o3" cx="29" cy="100" r="5" />
      </svg>
    </div>

    <header class="top">
      <div class="brand">
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
          <circle class="logo-ring" cx="11" cy="14" r="9" fill="none" stroke-width="1.4" />
          <circle class="logo-dot" cx="19" cy="14" r="5" />
        </svg>
        <div style="min-width: 0">
          <h1>Items</h1>
          <p class="meta" id="status">Waiting for data…</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-refresh" type="button" title="Reload" aria-label="Reload">
          <svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7" /><path d="M20 5v6h-6" /></svg>
        </button>
        <button class="icon-btn" id="btn-theme" type="button" aria-label="Switch to dark">
          <svg class="i" data-icon="sun" viewBox="0 0 24 24" hidden><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
          <svg class="i" data-icon="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></svg>
        </button>
      </div>
    </header>

    <section class="stats" aria-label="Summary">
      <div class="stat"><b id="kpi-total">—</b><span>items</span></div>
      <div class="stat"><b id="kpi-open">—</b><span>open</span></div>
      <div class="stat"><b id="kpi-review">—</b><span>in review</span></div>
      <div class="stat idle" id="kpi-pending-wrap"><b id="kpi-pending">000</b><span><i class="sig"></i>unsaved</span></div>
    </section>

    <nav class="tabs" role="tablist">
      <button class="tab" type="button" role="tab" data-tab="items"><span class="n">01</span>Items <span class="tab-count" id="tab-count-items"></span></button>
      <button class="tab" type="button" role="tab" data-tab="details"><span class="n">02</span>Details</button>
      <button class="tab" type="button" role="tab" data-tab="about"><span class="n">03</span>About</button>
    </nav>

    <section class="panel" id="panel-items" role="tabpanel">
      <div class="toolbar">
        <label class="search">
          <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
          <input id="filter-search" type="search" placeholder="Search items" autocomplete="off" />
        </label>
        <div class="pop-wrap">
          <button class="text-link" type="button" aria-expanded="false">filters<sup id="filters-count"></sup></button>
          <div class="popover">
            <label class="field">status<select id="filter-status"><option value="">All</option></select></label>
            <label class="field">owner<select id="filter-owner"><option value="">All</option></select></label>
            <div class="pop-actions"><button class="text-link" type="button" id="btn-clear-filters">clear all</button></div>
          </div>
        </div>
      </div>
      <div class="chips" id="chips"></div>
      <div class="table-wrap" id="table"></div>
    </section>

    <section class="panel" id="panel-details" role="tabpanel" hidden>
      <div id="detail"></div>
    </section>

    <section class="panel" id="panel-about" role="tabpanel" hidden>
      <div class="empty">
        <b>Build your app here</b>
        <span>This panel shows the empty-state pattern. Replace it with your own content.</span>
      </div>
    </section>

    <footer class="dock">
      <div class="dock-group">
        <span class="count" id="sel-count">0 in view</span>
      </div>
      <div class="dock-group" id="dock-pending" hidden>
        <span class="pending-label" id="pending-label"></span>
        <button class="db" type="button" id="btn-discard">Discard</button>
        <button class="db pri" type="button" id="btn-apply">Apply →</button>
      </div>
    </footer>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
