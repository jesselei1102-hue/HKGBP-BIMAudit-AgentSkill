<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GBP Model Audit Report</title>
<!--
  Model Audit report template (fallback).
  Preferred: generate with  python report/render_report.py --results audit-results.json --audience bim|ap --out report-<audience>.html
  Use this template only when the harness cannot run code. Fill each FILL block from audit-results.json
  (templates/audit-results.schema.json), apply the audience rules in each block, and keep meta.filled_by = "template".
  Styling follows the Ultraviolet design theme (tokens light/dark, one accent signal, hairlines, mono metadata).
  The <style id="report-css"> and <script id="report-js"> blocks are also read by render_report.py: edit them here only.
  No network: colours and type are inlined; system font stacks stand in for Inter / Noto Sans SC.

  Audience rules:
    - bim: the fix list leads; every object shows its location plate (object, kind, sheet, Revit ID) with Copy ID,
           Copy for agent and Fixed; Revit IDs are copied separated by "; " for Select by ID.
    - ap:  no element IDs, no tool names, no GAP-nn numbers, nothing with audience = "bim";
           labels FACT / INFERENCE / GAP become Verified / Inferred / Not determinable;
           Decisions required and Information required come right after the verdict.
  Sheet readings are never checked by a person in this audit: list every one as "not checked by a person", with its crop.
  An issue with `shot` shows its 96x72 thumbnail before the plate, linked to the full image in assets/; AP: at most three per task.
  Every status shows its text, not colour alone. All image paths are relative: assets/<file>.
-->
<style id="report-css">
/* Ultraviolet tokens + report layout. Colours only via variables; accent is the single chrome signal. */
:root{
  color-scheme:light;
  --bg:#ffffff;--s1:#f5f5f8;--s2:#ececf1;
  --line:rgba(18,17,24,.08);--line2:rgba(18,17,24,.16);
  --tx:#121118;--tx2:#5d5b6b;--tx3:#706e80;
  --accent:#7b61ff;--accent-tx:#5b41e0;--on-accent:#ffffff;
  --accent-soft:rgba(123,97,255,.07);--accent-hl:rgba(123,97,255,.2);--hl-tx:#3a2a99;
  --danger:#e5484d;
  --dock-bg:#121118;--dock-tx:#f2f1f7;--dock-tx2:rgba(242,241,247,.62);--dock-hover:rgba(255,255,255,.1);
  --pop-shadow:0 12px 32px rgba(18,17,24,.14),0 2px 6px rgba(18,17,24,.06);--glow:none;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --ui-font:system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei","Microsoft JhengHei",sans-serif;
  --ground:var(--bg);--paper:var(--s1);--ink:var(--tx);--ink-2:var(--tx2);--muted:var(--tx3);
  --line-2:var(--line2);--plate:var(--bg);--plate-ink:var(--tx);
  --sign:var(--dock-bg);--sign-deep:#1d1c27;--sign-ink:var(--dock-tx);--sign-soft:var(--dock-tx2);--sign-text:var(--accent-tx);
  --fail:var(--danger);--fail-tint:#fbe9e7;--major:#9c2a1f;--minor:var(--tx2);--minor-tint:var(--s2);
  --check:#8a4b00;--check-tint:#fdf1de;--pass:#1e6b34;--pass-tint:#e5f2e8;--na:var(--tx3);--na-tint:var(--s2);
  --focus:var(--accent);--select:var(--accent-hl);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e0d14;--s1:#16151e;--s2:#1d1c27;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.14);
  --tx:#ecebf3;--tx2:#9c9aae;--tx3:#858399;
  --accent:#8f7bff;--accent-tx:#b3a6ff;--on-accent:#0e0d14;
  --accent-soft:rgba(143,123,255,.07);--accent-hl:rgba(143,123,255,.28);--hl-tx:#d9d2ff;
  --danger:#f0605f;
  --dock-bg:#1d1c27;--dock-tx:#ecebf3;--dock-tx2:#9c9aae;--dock-hover:rgba(255,255,255,.06);
  --pop-shadow:0 16px 40px rgba(0,0,0,.55);--glow:0 0 10px var(--accent);
  --fail:var(--danger);--fail-tint:#3a1a1c;--major:#f0807a;--minor:var(--tx2);--minor-tint:var(--s2);
  --check:#e3a948;--check-tint:#3d311b;--pass:#5fc28a;--pass-tint:#1f3a2a;--na:var(--tx3);--na-tint:var(--s2);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:128px}
body{margin:0;background:var(--bg);color:var(--tx);
  font:15px/1.5 var(--ui-font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:var(--accent-hl);color:var(--hl-tx)}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.num,.plate-id,td.n,.progress,[data-shown-count]{font-family:var(--mono);font-variant-numeric:tabular-nums}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
*:hover{scrollbar-color:var(--tx3) transparent}

.band{background:var(--bg);color:var(--tx);position:sticky;top:0;z-index:10;border-bottom:.5px solid var(--line)}
.band-in{max-width:1240px;margin:0 auto;padding:18px 24px 0;display:grid;grid-template-columns:1fr auto;gap:8px 24px;align-items:end}
.band h1{margin:0;font-size:16px;line-height:1.3;font-weight:400;letter-spacing:-.01em}
.band .sub{margin:4px 0 0;font-family:var(--mono);font-size:11px;color:var(--tx3)}
.band-actions{justify-self:end;display:flex;align-items:center;gap:10px}
.verdict-sign{display:flex;align-items:center;gap:10px;background:var(--s1);color:var(--tx);
  border:.5px solid var(--line2);border-radius:8px;padding:7px 12px 7px 10px;font-size:13px;font-weight:500;white-space:nowrap}
.verdict-sign .mark{width:6px;height:6px;border-radius:50%;background:var(--danger);flex:none}
.verdict-sign.ok .mark{background:var(--pass)}.verdict-sign.partial .mark{background:var(--check)}
.verdict-sign .count{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--tx3)}
.icon-btn{width:30px;height:30px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--tx2);border:.5px solid var(--line2);background:var(--bg);cursor:pointer;padding:0}
.icon-btn:hover{color:var(--tx);border-color:var(--tx3)}
.icon-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.icon-btn [data-icon="sun"],:root[data-theme="dark"] .icon-btn [data-icon="moon"]{display:none}
:root[data-theme="dark"] .icon-btn [data-icon="sun"]{display:block}
.signs{grid-column:1/-1;display:flex;gap:26px;margin:14px 0 0;overflow-x:auto;border-bottom:.5px solid var(--line)}
.signs a{position:relative;color:var(--tx3);text-decoration:none;font-size:13px;font-weight:400;padding:10px 0;
  white-space:nowrap;display:inline-flex;align-items:baseline;gap:6px}
.signs a:hover{color:var(--tx2)}
.signs a .num{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--tx3)}
.signs .arrow{display:none}
.signs a.is-active{color:var(--tx)}
.signs a.is-active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);box-shadow:var(--glow)}

main{max-width:1240px;margin:0 auto;padding:8px 24px 64px}
section{padding:36px 0 8px;border-bottom:.5px solid var(--line)}
section:last-of-type{border-bottom:0}
h2{font-size:15px;line-height:1.3;margin:0 0 6px;font-weight:500;letter-spacing:-.01em}
h3{font-size:14px;margin:28px 0 8px;font-weight:500}
.lead{margin:0 0 18px;color:var(--tx2);max-width:72ch;font-size:13px}
.muted{color:var(--tx3)}
p{max-width:75ch;margin:0 0 10px}

.toolbar{position:sticky;top:118px;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;
  gap:8px 14px;padding:12px 0;border-bottom:.5px solid var(--line);margin-bottom:14px}
.seg{display:inline-flex;border:.5px solid var(--line2);border-radius:99px;overflow:hidden}
.seg button{font:inherit;font-size:12px;border:0;background:transparent;color:var(--tx2);padding:6px 12px;cursor:pointer;
  border-right:.5px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--tx);color:var(--bg)}
.seg button[aria-pressed="true"] .num{color:var(--accent)}
.seg button .num{margin-left:5px;font-family:var(--mono);font-size:11px;opacity:.85}
.toolbar select{font:inherit;font-size:12px;color:var(--tx);background:var(--bg);
  border:.5px solid var(--line2);border-radius:99px;padding:6px 12px}
.toolbar input[type="search"]{font:inherit;font-size:12px;color:var(--tx);min-width:200px;border-radius:0;
  border:0;border-bottom:.5px solid var(--line2);padding:7px 0;background:transparent}
.toolbar input[type="search"]:focus{outline:none;border-bottom-color:var(--accent)}
.toolbar input[type="search"]::placeholder{color:var(--tx3)}
.toolbar label{font-size:12px;color:var(--tx2);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.toolbar .spacer{flex:1}
.progress{font-size:11px;color:var(--tx3)}
.btn{font:inherit;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  border:.5px solid var(--line2);background:var(--bg);color:var(--tx);border-radius:99px;padding:6px 12px;white-space:nowrap}
.btn:hover{border-color:var(--tx3);color:var(--tx)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent);box-shadow:var(--glow)}
.btn.primary:hover{filter:brightness(1.08)}
.btn svg{width:14px;height:14px;flex:none}
.btn.done{border-color:var(--pass);color:var(--pass)}
.btn:disabled{opacity:.45;cursor:default}

.finding{border-top:.5px solid var(--line);padding:16px 0 10px}
.finding:first-of-type{border-top:0}
.f-head{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:baseline}
.f-head h3{margin:0;font-size:14px;line-height:1.35;font-weight:500}
.f-head .code{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--accent-tx);text-decoration:none;white-space:nowrap}
.f-head .code:hover{color:var(--tx)}
.f-meta{grid-column:2/-1;font-family:var(--mono);font-size:11px;color:var(--tx3)}
.f-fix{grid-column:2/-1;margin:4px 0 0;font-size:13px;color:var(--tx)}
.f-fix b{font-weight:500}
.f-actions{grid-row:1;grid-column:3;display:flex;gap:6px}
.sev{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.02em;border-radius:99px;padding:2px 8px;white-space:nowrap}
.sev-Blocker{background:var(--danger);color:#fff}
.sev-Major{background:var(--fail-tint);color:var(--major)}
.sev-Minor{background:var(--minor-tint);color:var(--minor)}
.sev-check{background:var(--check-tint);color:var(--check)}
.objs{list-style:none;margin:10px 0 0;padding:0 0 0 calc(12px + 4.2em)}
.obj{display:grid;grid-template-columns:auto minmax(220px,340px) 1fr auto;gap:12px;align-items:center;
  padding:8px 0;border-top:.5px dashed var(--line)}
.obj:first-child{border-top:0}
.with-shots .obj{grid-template-columns:auto 96px minmax(220px,340px) 1fr auto}
.shot{display:block;width:96px;height:72px;border:.5px solid var(--line2);border-radius:6px;background:var(--bg);overflow:hidden;cursor:zoom-in}
.shot img{display:block;width:100%;height:100%;object-fit:cover}
a.shot:hover{border-color:var(--accent);outline:1px solid var(--accent)}
.shot.none{display:flex;align-items:center;justify-content:center;text-align:center;border-style:dashed;
  font-family:var(--mono);font-size:11px;line-height:1.25;color:var(--tx3);padding:0 8px;cursor:default}
.obj.fixed .shot{opacity:.5}
.obj .tick{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;margin:0}
.obj .what{font-size:13px;color:var(--tx2);min-width:0}
.obj .acts{display:flex;gap:6px}
.obj.fixed .plate,.obj.fixed .what{opacity:.5}
.obj.fixed .what{text-decoration:line-through;text-decoration-color:var(--pass);text-decoration-thickness:2px}
.obj.fixed .plate{position:relative}
.obj.fixed .plate::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:2px;background:var(--pass);
  transform-origin:left;animation:strike .35s cubic-bezier(.16,1,.3,1) both}
@keyframes strike{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.obj.fixed .plate::after{animation:none}}

.plate{display:block;background:var(--plate);color:var(--plate-ink);border:.5px solid var(--line2);border-radius:6px;
  padding:6px 10px 5px;min-width:0}
.plate-name{display:block;font-size:13px;font-weight:500;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plate-line{display:block;font-family:var(--mono);font-size:11px;line-height:1.35;color:var(--tx3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate-line .plate-id{font-weight:500;color:var(--tx)}
.plate.no-id{border-style:dashed}

.shots{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.shots-more{font-family:var(--mono);font-size:11px;color:var(--tx3)}
.viewer{width:min(1200px,calc(100vw - 32px));height:calc(100vh - 32px);max-width:none;max-height:none;margin:auto;padding:0;
  border:0;border-radius:14px;background:var(--bg);color:var(--tx);box-shadow:var(--pop-shadow)}
.viewer[open]{display:grid;grid-template-rows:auto 1fr}
.viewer::backdrop{background:rgba(14,13,20,.72)}
.v-head{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--dock-bg);color:var(--dock-tx)}
.v-title{min-width:0}
.v-name{display:block;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v-sub{display:block;font-family:var(--mono);font-size:11px;color:var(--dock-tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v-acts{display:flex;align-items:center;gap:6px}
.v-pos{font-family:var(--mono);font-size:11px;color:var(--dock-tx2);margin-right:6px;white-space:nowrap}
.v-acts .btn{background:transparent;border-color:rgba(255,255,255,.14);color:var(--dock-tx)}
.v-acts .btn:hover{background:var(--dock-hover);border-color:transparent}
.v-stage{min-height:0;overflow:auto;background:var(--bg);display:flex;cursor:zoom-in}
.v-stage img{display:block;margin:auto;max-width:100%;max-height:100%}
.v-stage.full{cursor:zoom-out}
.v-stage.full img{max-width:none;max-height:none}

.readings{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:10px}
.reading{margin:0;border:.5px solid var(--line);border-radius:8px;background:var(--s1);overflow:hidden}
.reading .crop{display:flex;align-items:center;justify-content:center;min-height:96px;max-height:260px;overflow:hidden;
  background:var(--bg);border-bottom:.5px solid var(--line);cursor:zoom-in}
.reading .crop img{display:block;width:100%;height:auto;max-height:260px;object-fit:contain}
.reading .crop:hover{outline:2px solid var(--accent);outline-offset:-2px}
.reading .nocrop{height:96px;display:flex;align-items:center;justify-content:center;color:var(--tx3);font-family:var(--mono);font-size:11px;
  border-bottom:.5px solid var(--line)}
.reading .body{padding:8px 10px 10px}
.reading .val{font-family:var(--mono);font-size:18px;line-height:1.3;font-weight:400}
.reading .meta{font-family:var(--mono);font-size:11px;color:var(--tx3)}
.notice{border:.5px solid var(--check);background:var(--check-tint);color:var(--tx);border-radius:8px;padding:10px 14px;max-width:75ch;font-size:13px}

.table-wrap{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:.5px solid var(--line);padding:7px 10px 7px 0;text-align:left;vertical-align:top}
th{font-family:var(--mono);font-weight:400;color:var(--tx3);font-size:11px}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--tx)}
.st{display:inline-block;border-radius:99px;padding:1px 8px;font-family:var(--mono);font-size:11px;font-weight:500;white-space:nowrap}
.st-fail,.st-missing{background:var(--fail-tint);color:var(--fail)}
.st-partial,.st-unclear{background:var(--check-tint);color:var(--check)}
.st-pass{background:var(--pass-tint);color:var(--pass)}
.st-na,.st-nj{background:var(--na-tint);color:var(--na)}
details.task{border-top:.5px solid var(--line)}
details.task>summary{list-style:none;display:grid;grid-template-columns:5.2em 1fr auto auto;gap:12px;align-items:baseline;
  padding:10px 0;cursor:pointer}
details.task>summary::-webkit-details-marker{display:none}
details.task>summary .code{font-family:var(--mono);font-weight:400;color:var(--accent-tx);font-size:12px}
details.task>summary .name{font-weight:500;font-size:13px}
details.task>summary .name .muted{font-weight:400;font-size:12px}
details.task[open]>summary{border-bottom:.5px dashed var(--line)}
details.task .inner{padding:4px 0 18px 5.2em}
.thumbs{display:flex;flex-wrap:wrap;gap:12px}
.thumbs figure{margin:0;width:220px}
.thumbs img{width:220px;height:150px;object-fit:contain;background:var(--bg);border:.5px solid var(--line);border-radius:6px}
.thumbs figcaption{font-family:var(--mono);font-size:11px;color:var(--tx3)}
.links a{margin-right:14px;color:var(--accent-tx);font-size:12px}
.badge{font-family:var(--mono);font-size:11px;font-weight:400;border:.5px solid var(--line2);border-radius:99px;padding:0 6px;margin-right:6px;color:var(--tx2)}
.empty{padding:14px 0;color:var(--tx3);font-family:var(--mono);font-size:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(12px);opacity:0;pointer-events:none;
  background:var(--dock-bg);color:var(--dock-tx);border-radius:99px;padding:8px 14px;font-size:12px;
  transition:opacity .18s ease-out,transform .25s cubic-bezier(.16,1,.3,1);z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.verdict-list{margin:6px 0 0;padding-left:20px;max-width:75ch}
.verdict-list li{margin:3px 0}
.about td:first-child{color:var(--tx3);width:12em;font-family:var(--mono);font-size:11px}

@media (max-width:820px){
  .obj,.with-shots .obj{grid-template-columns:auto 1fr;grid-template-areas:"tick plate" ". what" ". shot" ". acts"}
  .obj .tick{grid-area:tick}.obj .plate{grid-area:plate}.obj .what{grid-area:what}.obj .acts{grid-area:acts}.obj .shot{grid-area:shot}
  .objs{padding-left:0}
  details.task>summary{grid-template-columns:4.6em 1fr}
  details.task>summary .st{display:none}
  details.task .inner{padding-left:0}
}
@media (max-width:640px){
  .band-in{grid-template-columns:1fr;padding:14px 16px 0}
  .band-actions{justify-self:start}
  main{padding:4px 16px 48px}
  .toolbar{top:0;position:static}
  .toolbar input[type="search"]{min-width:0;flex:1 1 100%}
  .toolbar .spacer{display:none}
  .f-head{grid-template-columns:auto 1fr}
  .f-meta,.f-fix{grid-column:1/-1}
  .f-actions{grid-row:5;grid-column:1/-1;margin-top:6px}
  html{scroll-padding-top:12px}
  .band{position:static}
  .signs{gap:18px}
}
@media print{
  .band{position:static;border-bottom:1px solid #d6dbe1;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .toolbar,.acts,.f-actions,.tick,.toast,.viewer,.shot.none,.icon-btn{display:none!important}
  .with-shots .obj{grid-template-columns:96px minmax(220px,340px) 1fr;break-inside:avoid}
  details.task{break-inside:avoid-page}
  .finding{break-inside:avoid-page}
  :root,:root[data-theme="dark"]{
    --bg:#fff;--s1:#f5f5f8;--tx:#121118;--tx2:#5d5b6b;--tx3:#706e80;--line:rgba(18,17,24,.12);--line2:rgba(18,17,24,.2);
    --accent:#7b61ff;--accent-tx:#5b41e0;--dock-bg:#121118;--dock-tx:#f2f1f7;--dock-tx2:rgba(242,241,247,.62);
  }
}
</style>
</head>
<body>
<header class="band">
  <div class="band-in">
    <div>
      <!-- FILL: meta.project as <h1>; <p class="sub">GBP Model Audit · BIM team edition | AP / client edition · meta.date · meta.model</p> -->
    </div>
    <div class="band-actions">
      <!-- FILL: <div class="verdict-sign">: "Ready to submit" (class ok) when verdict.submittable, "Partial audit · readiness not judged"
           (class partial) when the summary says partial, otherwise "Not ready to submit"; then the finding counts by severity. -->
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="Toggle colour theme" title="Toggle colour theme">
        <svg data-icon="moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 9.2A5.5 5.5 0 0 1 6.8 2.8 5.6 5.6 0 1 0 13.2 9.2z"/></svg>
        <svg data-icon="sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.2 3.2l1.4 1.4M11.4 11.4l1.4 1.4M3.2 12.8l1.4-1.4M11.4 4.6l1.4-1.4"/></svg>
      </button>
    </div>
    <nav class="signs" aria-label="Sections">
      <!-- FILL (bim): Fix list, To check, Tasks, Information, N/A, About.
           FILL (ap): Verdict, Decisions, Information required, Problems, To check, Not determinable, N/A, About. -->
    </nav>
  </div>
</header>
<main>
<!-- FILL (bim) <section id="fix">: one <article class="finding"> per finding, worst severity first: severity, TL code linking to
     #task-<id>, the rule, the fix, the clause, then every object from issues[] with action "fix": a location plate (object name;
     kind · sheet · Revit ID), "expected → actual", Copy ID and Copy for agent. Model health rows (tl MA-x.y) follow as their own blocks. -->
<!-- FILL <section id="check">: every reading in readings[] as "not checked by a person" with its crop and sheet; then issues[]
     with action "check" grouped by rule, each with what to look at. -->
<!-- FILL (bim) <section id="tasks">: model health table, then one <details class="task" id="task-<id>"> per task: TL, name,
     clause, L1 and L2 status; inside, the checks, calculations, evidence links, findings and direction of fix. -->
<!-- FILL <section id="information"> (bim) or <section id="decisions"> and <section id="inputs"> (ap): decisions required,
     information required, and (bim) not determinable. FILL <section id="na-table">: N/A table. FILL <section id="about">:
     the meta table, the disclaimer, the regression comparison when present, clauses cited and (bim) the evidence index. -->
</main>
<script id="report-js">
(function(){
  /* Ultraviolet theme: override > OS preference; sun/moon toggle */
  (function initTheme(){
    var root=document.documentElement, KEY='uv-theme', store=null;
    try{store=window.localStorage;}catch(e){store=null;}
    function system(){return (window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}
    function read(){try{var v=store&&store.getItem(KEY);return (v==='light'||v==='dark')?v:null;}catch(e){return null;}}
    function write(v){try{if(!store)return;if(v)store.setItem(KEY,v);else store.removeItem(KEY);}catch(e){}}
    function apply(t){root.dataset.theme=t;root.style.colorScheme=t;}
    function current(){return root.dataset.theme==='dark'?'dark':'light';}
    apply(read()||system());
    var btn=document.getElementById('theme-toggle');
    if(btn){btn.addEventListener('click',function(){
      var next=current()==='dark'?'light':'dark', base=system();
      write(next===base?null:next);apply(next);
    });}
    if(window.matchMedia){window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){
      if(!read())apply(system());
    });}
  })();
  (function(){
    function paint(){
      var id=decodeURIComponent(location.hash.slice(1));
      document.querySelectorAll('.signs a').forEach(function(a){
        var on=id&&a.getAttribute('href')==='#'+id;
        a.classList.toggle('is-active',!!on);
        if(on)a.setAttribute('aria-current','true');else a.removeAttribute('aria-current');
      });
    }
    window.addEventListener('hashchange',paint);paint();
  })();

  var doc=document, store=null, KEY='gbp-audit-fixed:'+location.pathname;
  try{store=window.localStorage;}catch(e){store=null;}
  function load(){try{return JSON.parse((store&&store.getItem(KEY))||'[]');}catch(e){return [];}}
  function save(list){try{if(store)store.setItem(KEY,JSON.stringify(list));}catch(e){}}
  var toast=doc.createElement('div');toast.className='toast';toast.setAttribute('role','status');toast.setAttribute('aria-live','polite');
  doc.body.appendChild(toast);var tt=null;
  function say(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('show');},1800);}
  function fallbackCopy(text){var ta=doc.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');
    ta.style.position='fixed';ta.style.opacity='0';doc.body.appendChild(ta);ta.select();var ok=false;
    try{ok=doc.execCommand('copy');}catch(e){ok=false;}doc.body.removeChild(ta);return ok;}
  function copy(text,msg,btn){
    function done(ok){
      if(ok){say(msg);if(btn){btn.classList.add('done');setTimeout(function(){btn.classList.remove('done');},1400);}}
      else{window.prompt('Copy with Ctrl+C, then press Enter',text);}
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){done(true);},function(){done(fallbackCopy(text));});}
    else done(fallbackCopy(text));
  }
  function idsIn(scope){var out=[];scope.querySelectorAll('.obj[data-id]').forEach(function(o){
    if(o.dataset.id&&!o.hidden&&!(o.closest('.finding')||{}).hidden&&out.indexOf(o.dataset.id)<0)out.push(o.dataset.id);});return out;}
  doc.addEventListener('click',function(ev){
    var b=ev.target.closest('[data-copy]');
    if(b){copy(b.getAttribute('data-copy'),b.getAttribute('data-copied')||'Copied',b);return;}
    var ids=ev.target.closest('[data-copy-ids]');
    if(ids){var scope=ids.closest('.finding')||doc.getElementById('fix')||doc;var list=idsIn(scope);
      if(!list.length){say('No Revit IDs in view');return;}
      copy(list.join('; '),'Copied '+list.length+' Revit ID'+(list.length===1?'':'s')+' for Select by ID',ids);}
  });
  /* fixed marks: kept per report file in this browser, never sent anywhere */
  var fixed=load();
  function paintFixed(){var n=0,all=0;doc.querySelectorAll('.obj[data-key]').forEach(function(o){
      var on=fixed.indexOf(o.dataset.key)>=0,inFix=!!o.closest('#fix');o.classList.toggle('fixed',on);
      var t=o.querySelector('.tick');if(t)t.checked=on;if(inFix){all++;if(on)n++;}});
    doc.querySelectorAll('[data-fixed-count]').forEach(function(el){el.textContent=n+' of '+all+' marked fixed';});}
  doc.addEventListener('change',function(ev){var t=ev.target;
    if(t.classList.contains('tick')){var k=t.closest('.obj').dataset.key,i=fixed.indexOf(k);
      if(t.checked&&i<0)fixed.push(k);if(!t.checked&&i>=0)fixed.splice(i,1);save(fixed);paintFixed();apply();}
    else if(t.closest('.toolbar'))apply();});
  /* filters over the fix list */
  var sev='';
  function apply(){
    var bar=doc.querySelector('.toolbar');if(!bar)return;
    var task=(bar.querySelector('[name="task"]')||{}).value||'',kind=(bar.querySelector('[name="kind"]')||{}).value||'';
    var q=((bar.querySelector('[name="q"]')||{}).value||'').trim().toLowerCase(),hide=(bar.querySelector('[name="hidefixed"]')||{}).checked;
    var shown=0;
    doc.querySelectorAll('#fix .finding').forEach(function(f){
      var fOk=(!sev||f.dataset.sev===sev)&&(!task||f.dataset.task===task),any=false;
      f.querySelectorAll('.obj').forEach(function(o){
        var ok=fOk&&(!kind||o.dataset.kind===kind)&&(!hide||!o.classList.contains('fixed'))&&(!q||(f.dataset.text+' '+o.dataset.text).indexOf(q)>=0);
        o.hidden=!ok;if(ok){any=true;shown++;}});
      f.hidden=!any;});
    var empty=doc.getElementById('fix-empty');if(empty)empty.hidden=shown>0;
    var c=doc.querySelector('[data-shown-count]');if(c)c.textContent=shown;
  }
  doc.querySelectorAll('.seg [data-sev]').forEach(function(b){b.addEventListener('click',function(){
    sev=b.dataset.sev;doc.querySelectorAll('.seg [data-sev]').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});apply();});});
  var qi=doc.querySelector('.toolbar [name="q"]');if(qi)qi.addEventListener('input',apply);
  /* screenshot viewer: over the report, moving only through the rows the filters leave */
  var viewer=null,cur=null;
  function shotsInView(){return Array.prototype.filter.call(doc.querySelectorAll('a.shot[data-shot]'),function(a){return a.offsetParent!==null;});}
  function buildViewer(){
    viewer=doc.createElement('dialog');viewer.className='viewer';viewer.setAttribute('aria-label','Screenshot');
    viewer.innerHTML='<div class="v-head"><div class="v-title"><span class="v-name"></span><span class="v-sub"></span></div><div class="v-acts"><span class="v-pos"></span>'
      +'<button type="button" class="btn" data-go="-1">Previous</button><button type="button" class="btn" data-go="1">Next</button><button type="button" class="btn" data-close>Close</button></div></div>'
      +'<div class="v-stage"><img alt=""></div>';
    doc.body.appendChild(viewer);
    viewer.addEventListener('click',function(ev){
      if(ev.target===viewer){viewer.close();return;}
      var go=ev.target.closest('[data-go]');if(go){step(+go.dataset.go);return;}
      if(ev.target.closest('[data-close]')){viewer.close();return;}
      if(ev.target.tagName==='IMG')ev.target.parentNode.classList.toggle('full');});
    viewer.addEventListener('keydown',function(ev){if(ev.key==='ArrowRight')step(1);else if(ev.key==='ArrowLeft')step(-1);});
    viewer.addEventListener('close',function(){if(cur)cur.focus();});
  }
  function show(a){
    var list=shotsInView(),i=list.indexOf(a);cur=a;
    viewer.querySelector('.v-name').textContent=a.dataset.name;
    viewer.querySelector('.v-sub').textContent=a.dataset.rule+' · '+a.dataset.where;
    viewer.querySelector('.v-pos').textContent=(i+1)+' of '+list.length;
    viewer.querySelector('.v-stage').classList.remove('full');
    var img=viewer.querySelector('.v-stage img');img.src=a.getAttribute('href');img.alt='Screenshot of '+a.dataset.name;
    viewer.querySelectorAll('[data-go]').forEach(function(b){b.disabled=list.length<2;});
  }
  function step(d){var list=shotsInView(),i=list.indexOf(cur);if(list.length)show(list[(i+d+list.length)%list.length]);}
  doc.addEventListener('click',function(ev){
    var a=ev.target.closest('a.shot[data-shot]');
    if(!a||!window.HTMLDialogElement||ev.ctrlKey||ev.metaKey||ev.shiftKey)return;
    ev.preventDefault();if(!viewer)buildViewer();show(a);viewer.showModal();});
  /* links to a task open its card */
  function openTarget(){var id=decodeURIComponent(location.hash.slice(1));var el=id&&doc.getElementById(id);if(el&&el.tagName==='DETAILS')el.open=true;}
  window.addEventListener('hashchange',openTarget);openTarget();
  doc.querySelectorAll('th.sortable').forEach(function(th){th.addEventListener('click',function(){
    var table=th.closest('table'),i=Array.prototype.indexOf.call(th.parentNode.children,th),rows=Array.prototype.slice.call(table.tBodies[0].rows);
    var asc=th.dataset.asc!=='1';th.dataset.asc=asc?'1':'0';
    rows.sort(function(a,b){var x=a.cells[i].dataset.key||a.cells[i].textContent,y=b.cells[i].dataset.key||b.cells[i].textContent;return (x>y?1:x<y?-1:0)*(asc?1:-1);});
    rows.forEach(function(r){table.tBodies[0].appendChild(r);});});});
  paintFixed();apply();
})();
</script>
</body>
</html>
