<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GBP Model Audit Report</title>
<!--
  Model Audit report template (fallback).
  Preferred: generate with  python report/render_report.py --results audit-results.json --audience bim|ap --out report-<audience>.html
  Use this template only when the harness cannot run code. Fill each FILL block from audit-results.json
  (templates/audit-results.schema.json), apply the audience rules in each block, and keep meta.filled_by = "template".
  The report keeps one ground, the white sheet of its road-sign world, in every colour scheme and in print.
  The <style id="report-css"> and <script id="report-js"> blocks are also read by render_report.py: edit them here only.

  Audience rules:
    - bim: the fix list leads; every object shows its location plate (object, kind, sheet, Revit ID) with Copy ID,
           Copy for agent and Fixed; Revit IDs are copied separated by "; " for Select by ID.
    - ap:  no element IDs, no tool names, no GAP-nn numbers, nothing with audience = "bim";
           labels FACT / INFERENCE / GAP become Verified / Inferred / Not determinable;
           Decisions required and Information required come right after the verdict.
  Sheet readings are never checked by a person in this audit: list every one as "not checked by a person", with its crop.
  Every status shows its text, not colour alone. All image paths are relative: assets/<file>.
-->
<style id="report-css">
:root{
  color-scheme:light;
  --sign:#17407a;--sign-deep:#0f2f5c;--sign-ink:#ffffff;--sign-soft:#c9d6ea;--sign-text:#17407a;
  --ground:#ffffff;--paper:#f3f5f8;--ink:#121519;--ink-2:#3e4650;--muted:#5a636d;--line:#d6dbe1;--line-2:#b9c0c8;
  --plate:#ffffff;--plate-ink:#121519;
  --fail:#b3261e;--fail-tint:#fbe9e7;--major:#9c2a1f;--minor:#3e4650;--minor-tint:#eceff2;
  --check:#8a4b00;--check-tint:#fdf1de;--pass:#1e6b34;--pass-tint:#e5f2e8;--na:#56616c;--na-tint:#eceff2;
  --focus:#2a6fd6;--select:#cfe0fb;
}
*{box-sizing:border-box}
html{scroll-padding-top:116px}
body{margin:0;background:var(--ground);color:var(--ink);
  font:15px/1.5 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,"Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:var(--select);color:var(--ink)}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
.num,.plate-id,td.n{font-variant-numeric:tabular-nums}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}

/* ---------- the direction sign: project, verdict, section signs ---------- */
.band{background:var(--sign);color:var(--sign-ink);position:sticky;top:0;z-index:10;
  box-shadow:0 2px 10px rgba(10,25,50,.18)}
.band-in{max-width:1240px;margin:0 auto;padding:14px 24px 0;display:grid;grid-template-columns:1fr auto;gap:6px 24px;align-items:end}
.band h1{margin:0;font-size:21px;line-height:1.3;font-weight:650;letter-spacing:-.01em}
.band .sub{margin:2px 0 0;font-size:13px;color:var(--sign-soft)}
.verdict-sign{justify-self:end;display:flex;align-items:center;gap:10px;background:var(--ground);color:var(--ink);
  border-radius:4px;padding:7px 12px 7px 10px;font-size:14px;font-weight:600;white-space:nowrap}
.verdict-sign .mark{width:10px;height:10px;border-radius:2px;background:var(--fail);flex:none}
.verdict-sign.ok .mark{background:var(--pass)}.verdict-sign.partial .mark{background:var(--check)}
.verdict-sign .count{font-weight:500;color:var(--muted)}
.signs{grid-column:1/-1;display:flex;gap:2px;margin:10px -10px 0;overflow-x:auto}
.signs a{color:var(--sign-ink);text-decoration:none;font-size:13.5px;font-weight:600;padding:8px 10px 10px;
  border-bottom:3px solid transparent;white-space:nowrap}
.signs a:hover{border-bottom-color:var(--sign-soft)}
.signs a .num{font-weight:500;color:var(--sign-soft);margin-left:5px}
.signs .arrow{display:inline-block;width:14px;height:10px;margin-right:6px;vertical-align:-1px}

/* ---------- page ---------- */
main{max-width:1240px;margin:0 auto;padding:8px 24px 64px}
section{padding:36px 0 8px;border-bottom:1px solid var(--line)}
section:last-of-type{border-bottom:0}
h2{font-size:20px;line-height:1.3;margin:0 0 6px;font-weight:650;letter-spacing:-.01em}
h3{font-size:16px;margin:28px 0 8px;font-weight:650}
.lead{margin:0 0 18px;color:var(--ink-2);max-width:72ch}
.muted{color:var(--muted)}
p{max-width:75ch}

/* ---------- toolbar ---------- */
.toolbar{position:sticky;top:104px;z-index:5;background:var(--ground);display:flex;flex-wrap:wrap;align-items:center;
  gap:8px 14px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:5px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:var(--ground);color:var(--ink-2);padding:6px 11px;cursor:pointer;
  border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--sign);color:var(--sign-ink)}
.seg button .num{margin-left:5px;opacity:.8}
.toolbar select,.toolbar input[type="search"]{font:inherit;font-size:13px;color:var(--ink);background:var(--ground);
  border:1px solid var(--line-2);border-radius:5px;padding:6px 8px}
.toolbar input[type="search"]{min-width:200px}
.toolbar label{font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.toolbar .spacer{flex:1}
.progress{font-size:13px;color:var(--muted)}
.btn{font:inherit;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  border:1px solid var(--line-2);background:var(--ground);color:var(--ink);border-radius:5px;padding:5px 10px;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--sign);border-color:var(--sign);color:var(--sign-ink)}
.btn.primary:hover{background:var(--sign-deep)}
.btn svg{width:14px;height:14px;flex:none}
.btn.done{border-color:var(--pass);color:var(--pass)}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- findings and their objects ---------- */
.finding{border-top:1px solid var(--line);padding:16px 0 10px}
.finding:first-of-type{border-top:0}
.f-head{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:baseline}
.f-head h3{margin:0;font-size:16px;line-height:1.35}
.f-head .code{font-size:12.5px;font-weight:600;color:var(--sign-text);text-decoration:none;white-space:nowrap}
.f-head .code:hover{text-decoration:underline}
.f-meta{grid-column:2/-1;font-size:13px;color:var(--muted)}
.f-fix{grid-column:2/-1;margin:4px 0 0;font-size:14px;color:var(--ink)}
.f-fix b{font-weight:650}
.f-actions{grid-row:1;grid-column:3;display:flex;gap:6px}
.sev{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.02em;border-radius:3px;padding:2px 7px;white-space:nowrap}
.sev-Blocker{background:var(--fail);color:#fff}
.sev-Major{background:var(--fail-tint);color:var(--major)}
.sev-Minor{background:var(--minor-tint);color:var(--minor)}
.sev-check{background:var(--check-tint);color:var(--check)}
.objs{list-style:none;margin:10px 0 0;padding:0 0 0 calc(12px + 4.2em)}
.obj{display:grid;grid-template-columns:auto minmax(220px,340px) 1fr auto;gap:12px;align-items:center;
  padding:8px 0;border-top:1px dashed var(--line)}
.obj:first-child{border-top:0}
.obj .tick{width:18px;height:18px;accent-color:var(--pass);cursor:pointer;margin:0}
.obj .what{font-size:13.5px;color:var(--ink-2);min-width:0}
.obj .acts{display:flex;gap:6px}
.obj.fixed .plate,.obj.fixed .what{opacity:.5}
.obj.fixed .what{text-decoration:line-through;text-decoration-color:var(--pass);text-decoration-thickness:2px}
.obj.fixed .plate{position:relative}
.obj.fixed .plate::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:2px;background:var(--pass);
  transform-origin:left;animation:strike .35s cubic-bezier(.16,1,.3,1) both}
@keyframes strike{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.obj.fixed .plate::after{animation:none}}

/* the street-name plate: where the object is */
.plate{display:block;background:var(--plate);color:var(--plate-ink);border:1.5px solid var(--plate-ink);border-radius:3px;
  padding:5px 10px 4px;min-width:0;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.plate-name{display:block;font-size:14px;font-weight:650;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plate-line{display:block;font-size:12px;line-height:1.35;color:#3e4650;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate-line .plate-id{font-weight:700;color:var(--plate-ink)}
.plate.no-id{border-style:dashed}

/* ---------- readings to check ---------- */
.readings{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:10px}
.reading{margin:0;border:1px solid var(--line);border-radius:5px;background:var(--paper);overflow:hidden}
.reading img{display:block;width:100%;height:150px;object-fit:contain;background:#fff;border-bottom:1px solid var(--line)}
.reading .nocrop{height:150px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;
  border-bottom:1px solid var(--line)}
.reading .body{padding:8px 10px 10px}
.reading .val{font-size:18px;line-height:1.3;font-weight:650}
.reading .meta{font-size:12.5px;color:var(--muted)}
.notice{border:1px solid var(--check);background:var(--check-tint);color:var(--ink);border-radius:5px;padding:10px 14px;max-width:75ch}

/* ---------- tables, tasks ---------- */
.table-wrap{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:7px 10px 7px 0;text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12.5px}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--ink)}
.st{display:inline-block;border-radius:3px;padding:1px 7px;font-size:12px;font-weight:600;white-space:nowrap}
.st-fail,.st-missing{background:var(--fail-tint);color:var(--fail)}
.st-partial,.st-unclear{background:var(--check-tint);color:var(--check)}
.st-pass{background:var(--pass-tint);color:var(--pass)}
.st-na,.st-nj{background:var(--na-tint);color:var(--na)}
details.task{border-top:1px solid var(--line)}
details.task>summary{list-style:none;display:grid;grid-template-columns:5.2em 1fr auto auto;gap:12px;align-items:baseline;
  padding:10px 0;cursor:pointer}
details.task>summary::-webkit-details-marker{display:none}
details.task>summary .code{font-weight:650;color:var(--sign-text);font-size:13px}
details.task>summary .name{font-weight:600}
details.task>summary .name .muted{font-weight:400;font-size:13px}
details.task[open]>summary{border-bottom:1px dashed var(--line)}
details.task .inner{padding:4px 0 18px 5.2em}
.thumbs{display:flex;flex-wrap:wrap;gap:12px}
.thumbs figure{margin:0;width:220px}
.thumbs img{width:220px;height:150px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:4px}
.thumbs figcaption{font-size:12px;color:var(--muted)}
.links a{margin-right:14px}
.badge{font-size:12px;font-weight:600;border:1px solid var(--line-2);border-radius:3px;padding:0 5px;margin-right:6px;color:var(--ink-2)}
.empty{padding:14px 0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(12px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--ground);border-radius:5px;padding:8px 14px;font-size:13.5px;
  transition:opacity .18s ease-out,transform .25s cubic-bezier(.16,1,.3,1);z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.verdict-list{margin:6px 0 0;padding-left:20px;max-width:75ch}
.verdict-list li{margin:3px 0}
.about td:first-child{color:var(--muted);width:12em}

@media (max-width:820px){
  .obj{grid-template-columns:auto 1fr;grid-template-areas:"tick plate" ". what" ". acts"}
  .obj .tick{grid-area:tick}.obj .plate{grid-area:plate}.obj .what{grid-area:what}.obj .acts{grid-area:acts}
  .objs{padding-left:0}
  details.task>summary{grid-template-columns:4.6em 1fr}
  details.task>summary .st{display:none}
  details.task .inner{padding-left:0}
}
@media (max-width:640px){
  .band-in{grid-template-columns:1fr;padding:12px 16px 0}
  .verdict-sign{justify-self:start}
  main{padding:4px 16px 48px}
  .toolbar{top:0;position:static}
  .toolbar input[type="search"]{min-width:0;flex:1 1 100%}
  .toolbar .spacer{display:none}
  .f-head{grid-template-columns:auto 1fr}
  .f-meta,.f-fix{grid-column:1/-1}
  .f-actions{grid-row:5;grid-column:1/-1;margin-top:6px}
  html{scroll-padding-top:12px}
  .band{position:static}
}
@media print{
  .band{position:static;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .toolbar,.acts,.f-actions,.tick,.toast{display:none!important}
  details.task{break-inside:avoid-page}
  .finding{break-inside:avoid-page}
}
</style>
</head>
<body>
<header class="band">
  <div class="band-in">
    <div>
      <!-- FILL: meta.project as <h1>; <p class="sub">GBP Model Audit · BIM team edition | AP / client edition · meta.date · meta.model</p> -->
    </div>
    <!-- FILL: <div class="verdict-sign">: "Ready to submit" (class ok) when verdict.submittable, "Partial audit · readiness not judged"
         (class partial) when the summary says partial, otherwise "Not ready to submit"; then the finding counts by severity. -->
    <nav class="signs" aria-label="Sections">
      <!-- FILL (bim): Fix list, To check, Tasks, Information, N/A, About.
           FILL (ap): Verdict, Decisions, Information required, Problems, To check, Not determinable, N/A, About. -->
    </nav>
  </div>
</header>
<main>
<!-- FILL (bim) <section id="fix">: one <article class="finding"> per finding, worst severity first: severity, TL code linking to
     #task-<id>, the rule, the fix, the clause, then every object from issues[] with action "fix": a location plate (object name;
     kind · sheet · Revit ID), "expected → actual", Copy ID and Copy for agent. Model health rows (tl MA-x.y) follow as their own blocks. -->
<!-- FILL <section id="check">: every reading in readings[] as "not checked by a person" with its crop and sheet; then issues[]
     with action "check" grouped by rule, each with what to look at. -->
<!-- FILL (bim) <section id="tasks">: model health table, then one <details class="task" id="task-<id>"> per task: TL, name,
     clause, L1 and L2 status; inside, the checks, calculations, evidence links, findings and direction of fix. -->
<!-- FILL <section id="information"> (bim) or <section id="decisions"> and <section id="inputs"> (ap): decisions required,
     information required, and (bim) not determinable. FILL <section id="na-table">: N/A table. FILL <section id="about">:
     the meta table, the disclaimer, the regression comparison when present, clauses cited and (bim) the evidence index. -->
</main>
<script id="report-js">
(function(){
  var doc=document, store=null, KEY='gbp-audit-fixed:'+location.pathname;
  try{store=window.localStorage;}catch(e){store=null;}
  function load(){try{return JSON.parse((store&&store.getItem(KEY))||'[]');}catch(e){return [];}}
  function save(list){try{if(store)store.setItem(KEY,JSON.stringify(list));}catch(e){}}
  var toast=doc.createElement('div');toast.className='toast';toast.setAttribute('role','status');toast.setAttribute('aria-live','polite');
  doc.body.appendChild(toast);var tt=null;
  function say(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('show');},1800);}
  function fallbackCopy(text){var ta=doc.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');
    ta.style.position='fixed';ta.style.opacity='0';doc.body.appendChild(ta);ta.select();var ok=false;
    try{ok=doc.execCommand('copy');}catch(e){ok=false;}doc.body.removeChild(ta);return ok;}
  function copy(text,msg,btn){
    function done(ok){
      if(ok){say(msg);if(btn){btn.classList.add('done');setTimeout(function(){btn.classList.remove('done');},1400);}}
      else{window.prompt('Copy with Ctrl+C, then press Enter',text);}
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){done(true);},function(){done(fallbackCopy(text));});}
    else done(fallbackCopy(text));
  }
  function idsIn(scope){var out=[];scope.querySelectorAll('.obj[data-id]').forEach(function(o){
    if(o.dataset.id&&!o.hidden&&!(o.closest('.finding')||{}).hidden&&out.indexOf(o.dataset.id)<0)out.push(o.dataset.id);});return out;}
  doc.addEventListener('click',function(ev){
    var b=ev.target.closest('[data-copy]');
    if(b){copy(b.getAttribute('data-copy'),b.getAttribute('data-copied')||'Copied',b);return;}
    var ids=ev.target.closest('[data-copy-ids]');
    if(ids){var scope=ids.closest('.finding')||doc.getElementById('fix')||doc;var list=idsIn(scope);
      if(!list.length){say('No Revit IDs in view');return;}
      copy(list.join('; '),'Copied '+list.length+' Revit ID'+(list.length===1?'':'s')+' for Select by ID',ids);}
  });
  /* fixed marks: kept per report file in this browser, never sent anywhere */
  var fixed=load();
  function paintFixed(){var n=0,all=0;doc.querySelectorAll('.obj[data-key]').forEach(function(o){
      var on=fixed.indexOf(o.dataset.key)>=0,inFix=!!o.closest('#fix');o.classList.toggle('fixed',on);
      var t=o.querySelector('.tick');if(t)t.checked=on;if(inFix){all++;if(on)n++;}});
    doc.querySelectorAll('[data-fixed-count]').forEach(function(el){el.textContent=n+' of '+all+' marked fixed';});}
  doc.addEventListener('change',function(ev){var t=ev.target;
    if(t.classList.contains('tick')){var k=t.closest('.obj').dataset.key,i=fixed.indexOf(k);
      if(t.checked&&i<0)fixed.push(k);if(!t.checked&&i>=0)fixed.splice(i,1);save(fixed);paintFixed();apply();}
    else if(t.closest('.toolbar'))apply();});
  /* filters over the fix list */
  var sev='';
  function apply(){
    var bar=doc.querySelector('.toolbar');if(!bar)return;
    var task=(bar.querySelector('[name="task"]')||{}).value||'',kind=(bar.querySelector('[name="kind"]')||{}).value||'';
    var q=((bar.querySelector('[name="q"]')||{}).value||'').trim().toLowerCase(),hide=(bar.querySelector('[name="hidefixed"]')||{}).checked;
    var shown=0;
    doc.querySelectorAll('#fix .finding').forEach(function(f){
      var fOk=(!sev||f.dataset.sev===sev)&&(!task||f.dataset.task===task),any=false;
      f.querySelectorAll('.obj').forEach(function(o){
        var ok=fOk&&(!kind||o.dataset.kind===kind)&&(!hide||!o.classList.contains('fixed'))&&(!q||(f.dataset.text+' '+o.dataset.text).indexOf(q)>=0);
        o.hidden=!ok;if(ok){any=true;shown++;}});
      f.hidden=!any;});
    var empty=doc.getElementById('fix-empty');if(empty)empty.hidden=shown>0;
    var c=doc.querySelector('[data-shown-count]');if(c)c.textContent=shown;
  }
  doc.querySelectorAll('.seg [data-sev]').forEach(function(b){b.addEventListener('click',function(){
    sev=b.dataset.sev;doc.querySelectorAll('.seg [data-sev]').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});apply();});});
  var qi=doc.querySelector('.toolbar [name="q"]');if(qi)qi.addEventListener('input',apply);
  /* links to a task open its card */
  function openTarget(){var id=decodeURIComponent(location.hash.slice(1));var el=id&&doc.getElementById(id);if(el&&el.tagName==='DETAILS')el.open=true;}
  window.addEventListener('hashchange',openTarget);openTarget();
  doc.querySelectorAll('th.sortable').forEach(function(th){th.addEventListener('click',function(){
    var table=th.closest('table'),i=Array.prototype.indexOf.call(th.parentNode.children,th),rows=Array.prototype.slice.call(table.tBodies[0].rows);
    var asc=th.dataset.asc!=='1';th.dataset.asc=asc?'1':'0';
    rows.sort(function(a,b){var x=a.cells[i].dataset.key||a.cells[i].textContent,y=b.cells[i].dataset.key||b.cells[i].textContent;return (x>y?1:x<y?-1:0)*(asc?1:-1);});
    rows.forEach(function(r){table.tBodies[0].appendChild(r);});});});
  paintFixed();apply();
})();
</script>
</body>
</html>
